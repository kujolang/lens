name: "Lens Browser QA"
description: "Run deterministic browser/visual QA with Lens and upload the report."
author: "Robert DeVore"
branding:
  icon: "eye"
  color: "blue"

inputs:
  url:
    description: "URL to check (localhost-first; use allow-external for public URLs)."
    required: true
  fail-on:
    description: "Severity threshold: info | warning | error | critical."
    required: false
    default: "error"
  args:
    description: "Extra Lens flags (e.g. '--html --accessibility --check-links')."
    required: false
    default: "--html"
  lens-dir:
    description: "Path to the lens checkout."
    required: false
    default: "."
  kujo-bin:
    description: "Path to the built kujo binary."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Lens exit code (0 ok, 1 findings, 2-4 setup/runtime)."
    value: ${{ steps.run.outputs.exit-code }}
  report-dir:
    description: "Directory containing the generated report and artifacts."
    value: ${{ steps.run.outputs.report-dir }}

runs:
  using: "composite"
  steps:
    - name: Install bridge dependencies
      shell: bash
      working-directory: ${{ inputs.lens-dir }}/bridge
      run: |
        npm ci
        npm run install-browser

    - name: Run Lens
      id: run
      shell: bash
      working-directory: ${{ inputs.lens-dir }}
      env:
        LENS_ACTION_ARGS: ${{ inputs.args }}
        LENS_ACTION_FAIL_ON: ${{ inputs.fail-on }}
        LENS_ACTION_KUJO_BIN: ${{ inputs.kujo-bin }}
        LENS_ACTION_URL: ${{ inputs.url }}
      run: |
        set -euo pipefail
        if [ -n "$LENS_ACTION_KUJO_BIN" ]; then export KUJO_BIN="$LENS_ACTION_KUJO_BIN"; fi

        # Tokenize the optional argument string without evaluating it as shell
        # code. GitHub Action inputs are data, and may be supplied by an
        # untrusted workflow trigger; direct interpolation here would permit
        # command substitution. shlex preserves quoted values such as device
        # names while the NUL delimiter preserves whitespace exactly.
        lens_args=()
        lens_args_file="$(mktemp)"
        trap 'rm -f "$lens_args_file"' EXIT
        python3 - "$LENS_ACTION_ARGS" > "$lens_args_file" <<'PY'
        import shlex
        import sys

        for value in shlex.split(sys.argv[1]):
            sys.stdout.buffer.write(value.encode("utf-8") + b"\0")
        PY
        while IFS= read -r -d '' arg; do
          lens_args+=("$arg")
        done < "$lens_args_file"
        rm -f "$lens_args_file"
        trap - EXIT

        OUT=".lens/runs/ci"
        set +e
        ./lens check "$LENS_ACTION_URL" --fail-on "$LENS_ACTION_FAIL_ON" --out "$OUT" "${lens_args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report-dir=$OUT" >> "$GITHUB_OUTPUT"
        exit $code

    - name: Upload Lens report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lens-report
        path: ${{ inputs.lens-dir }}/.lens/runs/ci
