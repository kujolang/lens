name: kujo-tool-artifacts-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tool-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify ignore coverage and pushed commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A force-push can leave the previous commit outside fetched refs.
          # Fetch that exact base; keep the guard's complete-range validation.
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          bash .github/scripts/check-kujo-tool-artifacts.sh

