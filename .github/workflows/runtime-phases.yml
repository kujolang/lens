name: Browser phase diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - name: Install matching candidate and baseline engines
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD origin/main
          npm ci --prefix bridge
          cd bridge
          npx playwright-core install-deps chromium
          npm run install-browser
          cd ..
          git worktree add "$RUNNER_TEMP/lens-base" origin/main
          cd "$RUNNER_TEMP/lens-base/bridge"
          npm ci
          npx playwright-core install chromium --only-shell

      - name: Profile alternating browser phases
        run: python3 scripts/bench-phase-comparison.py "$RUNNER_TEMP/lens-base" "$RUNNER_TEMP/phases.json" 8

      - name: Upload phase receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lens-phase-receipts
          path: ${{ runner.temp }}/phases.json
