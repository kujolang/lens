name: Performance regression check

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'performance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lens
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: lens
          fetch-depth: 0

      - name: Checkout Kujo runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kujolang/kujo
          path: kujo

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kujo/target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('kujo/Cargo.lock') }}

      - name: Build Kujo
        working-directory: kujo
        run: cargo build --release

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lens/bridge/package-lock.json

      - name: Install browser dependencies
        working-directory: lens/bridge
        run: |
          npm ci
          npx playwright-core install-deps chromium
          npm run install-browser

      - name: Create base worktree
        working-directory: lens
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          git worktree add "$RUNNER_TEMP/lens-base" "$BASE_SHA"
          npm ci --prefix "$RUNNER_TEMP/lens-base/bridge"

      - name: Compare same-runner medians
        working-directory: lens
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
        run: |
          set -euo pipefail
          LENS_BENCH_TARGET_ROOT="$RUNNER_TEMP/lens-base" scripts/bench.sh 3 "$RUNNER_TEMP/before.json"
          scripts/bench.sh 3 "$RUNNER_TEMP/after.json"
          python3 scripts/compare-benchmarks.py \
            "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" \
            --threshold-percent 20 --warn-only

      - name: Upload benchmark receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lens-benchmark-receipts
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
